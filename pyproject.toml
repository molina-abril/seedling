[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seedling"
version = "1.0.1"
description = "End-to-end literature review pipeline"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.11,<3.13"
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic>=2.10,<3",
    "requests>=2.31",
    "pypdf>=4.0",
    "python-dateutil>=2.8",
    "ruamel.yaml>=0.18",
    "tqdm>=4.66",
    "python-dotenv>=1.0",
    "rapidfuzz>=3,<4",
    "chardet>=5.0",
    "numpy>=1.26,<2",
    "scikit-learn>=1.3",
    "bertopic>=0.16",
    "sentence-transformers>=3.2",
    "transformers>=4.41,<5",
    "umap-learn>=0.5",
    "gensim>=4.0,<5",
    "pybliometrics>=3.5,<4",
    "openai>=1.70,<2",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pandas>=2.0",
    "scipy>=1.11",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Los tests importan `src.*`, así que el repo root debe estar en sys.path.
pythonpath = ["."]
testpaths = ["tests"]
# Por defecto saltamos tests que hacen network real o consumen cuota de APIs
# (Scopus, arXiv, OpenAI). Para correrlos: `pytest -m integration`.
addopts = "-m 'not integration'"
markers = [
    "integration: end-to-end tests que requieren network real y API keys (Scopus/arXiv/OpenAI). Saltados por defecto.",
]
