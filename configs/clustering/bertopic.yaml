bertopic:
  embedding_model: "all-MiniLM-L6-v2"

  umap:
    n_neighbors: 3

    n_components: 5

    min_dist: 0.0

    metric: "cosine"

    random_state: 1001

    n_jobs: 1

  hdbscan:
    min_cluster_size: 2

    min_samples: 1

    metric: "euclidean"

    cluster_selection_method: "leaf"

    prediction_data: true

  calculate_probabilities: true

  nr_topics: null

  auto_tune:
    enabled: true
    metric: "holistic_composite"
    min_coverage: 0.5
    min_clusters: 2
    granularity_min_clusters: 10
    weights:
      silhouette: 1.0
      coverage: 1.0
      granularity: 2.0
      persistence: 0.5
    grid:
      min_cluster_size: [2, 3, 4, 5]
      min_samples: [1, 2]
      cluster_selection_epsilon: [0.0, 0.1, 0.2]

  semantic_merge:
    enabled: true
    similarity_threshold: 0.85

  preprocessing:
    stop_words: ["en"]

    lowercase: true

    remove_accents: true

    remove_special_chars: true

    remove_numbers: true

    custom_words: []

    min_words_per_doc: 120

output:
  save_model: true

  model_path: "models/clustering/bertopic_model"

  export_clusters: true

  clusters_path: "results/clustering/clusters.json"

  export_metrics: true

  metrics_path: "results/clustering/clustering_metrics.json"
